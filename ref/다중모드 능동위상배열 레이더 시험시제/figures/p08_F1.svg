    <path fill="#f2f2f2" stroke-width="2.1"
          d="M153,144
             C 195,131 250,115 300,105
             L 306,103
             L 322,84 L 341,76
             C 380,67 421,73 448,96
             L 485,104 L 597,124 L 687,142
             L 896,24 L 959,31 L 893,147
             L 905,160 L 921,168 L 923,198 L 900,206
             L 800,200 L 700,192 L 600,184 L 500,177
             L 460,176 L 441,181 L 428,175 L 420,160
             L 350,152 L 250,147 L 153,146 Z"/>

