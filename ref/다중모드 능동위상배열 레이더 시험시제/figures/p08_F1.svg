<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 502" width="1000" height="502"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>그림 6 Body 좌표계</title>
  <defs>
