    <line x1="601" y1="179" x2="519" y2="173" marker-end="url(#arrs_B_p08_F1)"/>
    <line x1="601" y1="179" x2="570" y2="150" marker-end="url(#arrs_B_p08_F1)"/>
    <line x1="601" y1="179" x2="588" y2="239" marker-end="url(#arrs_B_p08_F1)"/>
  </g>

  <!-- 원점 -->
  <circle cx="601" cy="179" r="5.5" fill="#000"/>

  <!-- 축 라벨 -->
  <g fill="#000" font-style="italic" font-size="20"
     style="paint-order:stroke; stroke:#ffffff; stroke-width:4; stroke-linejoin:round">
    <text x="20" y="106">x<tspan dy="6" font-size="13">B</tspan><tspan dy="-6"> </tspan></text>
    <text x="484" y="49">y<tspan dy="6" font-size="13">B</tspan><tspan dy="-6"> </tspan></text>
    <text x="525" y="487">z<tspan dy="6" font-size="13">B</tspan><tspan dy="-6"> </tspan></text>
  </g>

  <!-- 단위벡터 라벨 -->
  <g fill="#000" font-style="italic" font-size="18"
     style="paint-order:stroke; stroke:#ffffff; stroke-width:4; stroke-linejoin:round">
    <text x="502" y="161">î<tspan dy="5" font-size="12">B</tspan><tspan dy="-5"> </tspan></text>
    <text x="576" y="150">ĵ<tspan dy="5" font-size="12">B</tspan><tspan dy="-5"> </tspan></text>
    <text x="604" y="264">k<tspan dy="5" font-size="12">B</tspan><tspan dy="-5"> </tspan></text>
  </g>
  <path d="M604,251 L609,245 L614,251" fill="none" stroke="#000" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
