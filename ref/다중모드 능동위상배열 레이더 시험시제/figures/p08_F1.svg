  </defs>

  <rect width="1000" height="502" fill="#ffffff"/>

  <!-- ================= aircraft (F-16 형상 단순화, 기수 좌측) ================= -->
  <g stroke="#000" stroke-linejoin="round" stroke-linecap="round">

