    <g fill="none" stroke-width="1.2">
      <path d="M299,105 L299,148"/>
      <path d="M420,160 C 412,166 412,175 421,179"/>
      <path d="M687,142 L893,147"/>
      <path d="M790,50 L946,55"/>
      <path d="M905,160 L923,198"/>
      <path d="M900,168 L921,172 M900,180 L922,183 M901,192 L922,194"/>
    </g>
    <g fill="#d6d6d6" stroke-width="1.1">
      <rect x="279" y="136" width="13" height="7" rx="3.5"/>
      <rect x="301" y="136" width="42" height="8" rx="4"/>
    </g>

    <!-- 근측(near side) 주익 -->
    <path fill="#e8e8e8" stroke-width="2" d="M485,180 L935,258 L980,276 L645,220 Z"/>
    <path fill="none" stroke-width="1.2" d="M600,205 L952,265"/>

