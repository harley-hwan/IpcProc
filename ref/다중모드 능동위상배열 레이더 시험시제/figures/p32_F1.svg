<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" width="1050" height="580"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>그림 24 VC-NED 좌표계를 통한 추적데이터 관리</title>
  <defs>
    <marker id="arr_B_p32_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="vec_B_p32_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1050" height="580" fill="#ffffff"/>

  <!-- ===== NED 좌표계 영역 (외곽 박스) ===== -->
  <rect x="24" y="100" width="740" height="396" fill="none" stroke="#000" stroke-width="2"/>

  <!-- ===== 연결선 ===== -->
  <!-- ④ INU -> 측정된 Target -->
  <path d="M790,422 H716" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- 측정된 Target -> Correlation -->
  <path d="M512,422 H481" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- Track Storage -> Correlation -->
  <path d="M230,422 H281" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- Correlation -> Association -->
  <path d="M380,396 V350" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- Association -> Track Initiation/Update/Termination -->
  <path d="M380,292 V248" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- Track Initiation/Update/Termination -> ⑥ INU -->
  <path d="M380,186 V80" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- Track Initiation/Update/Termination -> Track Storage (좌측 우회) -->
  <path d="M132,214 H82 V392" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- Track Storage -> ECEF -->
  <path d="M96,448 V510" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#arr_B_p32_F1)"/>
  <!-- 외부 전투체계와의 표적정보 공유 (점선) -->
  <path d="M190,482 H104" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr_B_p32_F1)"/>
  <text x="200" y="488" font-size="16">외부 전투체계와 표적정보 공유</text>

  <!-- ===== ⑥ INU ( P_inu ) ===== -->
  <rect x="268" y="22" width="224" height="52" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <circle cx="292" cy="48" r="11" fill="#000"/>
  <text x="292" y="53" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="312" y="54" font-size="17" font-weight="bold">INU (</text>
  <text x="368" y="54" font-size="17" font-weight="bold" font-style="italic">P</text>
  <text x="380" y="59" font-size="12" font-style="italic">inu</text>
  <text x="404" y="54" font-size="17" font-weight="bold">)</text>
  <path d="M366,33 H400" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#vec_B_p32_F1)"/>

  <!-- ===== ⑤ NED ( P_nv ) 라벨 ===== -->
  <circle cx="48" cy="128" r="11" fill="#000"/>
  <text x="48" y="133" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="70" y="134" font-size="17" font-weight="bold">NED (</text>
  <text x="130" y="134" font-size="17" font-weight="bold" font-style="italic">P</text>
  <text x="142" y="139" font-size="12" font-style="italic">nv</text>
  <text x="162" y="134" font-size="17" font-weight="bold">)</text>
  <path d="M128,113 H158" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#vec_B_p32_F1)"/>

  <!-- ===== Track Initiation/Update/Termination ===== -->
  <rect x="132" y="186" width="500" height="56" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <text x="382" y="221" font-size="18" font-weight="bold" text-anchor="middle">Track Initiation/Update/Termination</text>

  <!-- ===== Association ===== -->
  <rect x="285" y="292" width="190" height="52" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <text x="380" y="325" font-size="18" font-weight="bold" text-anchor="middle">Association</text>

  <!-- ===== Correlation ===== -->
  <rect x="285" y="396" width="190" height="52" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <text x="380" y="429" font-size="18" font-weight="bold" text-anchor="middle">Correlation</text>

  <!-- ===== 측정된 Target ===== -->
  <rect x="512" y="396" width="196" height="52" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <text x="610" y="429" font-size="18" font-weight="bold" text-anchor="middle">측정된 Target</text>

  <!-- ===== Track Storage ===== -->
  <rect x="32" y="396" width="198" height="52" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <text x="131" y="429" font-size="18" font-weight="bold" text-anchor="middle">Track Storage</text>

  <!-- ===== ④ INU ( P_inu ) ===== -->
  <rect x="790" y="398" width="220" height="56" rx="3" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>
  <circle cx="812" cy="426" r="11" fill="#000"/>
  <text x="812" y="431" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="832" y="433" font-size="17" font-weight="bold">INU (</text>
  <text x="888" y="433" font-size="17" font-weight="bold" font-style="italic">P</text>
  <text x="900" y="438" font-size="12" font-style="italic">inu</text>
  <text x="924" y="433" font-size="17" font-weight="bold">)</text>
  <path d="M886,412 H920" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#vec_B_p32_F1)"/>

  <!-- ===== ECEF ( P_e ) ===== -->
  <rect x="24" y="514" width="222" height="54" rx="3" fill="#f2f2f2" stroke="#000" stroke-width="1.6"/>
  <text x="46" y="548" font-size="17" font-weight="bold">ECEF (</text>
  <text x="116" y="548" font-size="17" font-weight="bold" font-style="italic">P</text>
  <text x="128" y="553" font-size="12" font-style="italic">e</text>
  <text x="140" y="548" font-size="17" font-weight="bold">)</text>
  <path d="M114,527 H136" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#vec_B_p32_F1)"/>
</svg>
