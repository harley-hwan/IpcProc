    <line x1="929.9" y1="55" x2="929.9" y2="313"/>
    <line x1="958.3" y1="55" x2="958.3" y2="313"/>
    <line x1="986.8" y1="55" x2="986.8" y2="313"/>
    <line x1="745" y1="69.3"  x2="1001" y2="69.3"/>
    <line x1="745" y1="98.0"  x2="1001" y2="98.0"/>
    <line x1="745" y1="126.7" x2="1001" y2="126.7"/>
    <line x1="745" y1="155.3" x2="1001" y2="155.3"/>
    <line x1="745" y1="184"   x2="1001" y2="184"/>
    <line x1="745" y1="212.7" x2="1001" y2="212.7"/>
    <line x1="745" y1="241.3" x2="1001" y2="241.3"/>
    <line x1="745" y1="270.0" x2="1001" y2="270.0"/>
    <line x1="745" y1="298.7" x2="1001" y2="298.7"/>
  </g>

  <!-- tick marks -->
  <g stroke="#000" stroke-width="1.2">
    <line x1="759.2" y1="313" x2="759.2" y2="307"/>
    <line x1="787.7" y1="313" x2="787.7" y2="307"/>
    <line x1="816.1" y1="313" x2="816.1" y2="307"/>
    <line x1="844.6" y1="313" x2="844.6" y2="307"/>
    <line x1="873"   y1="313" x2="873"   y2="307"/>
    <line x1="901.4" y1="313" x2="901.4" y2="307"/>
    <line x1="929.9" y1="313" x2="929.9" y2="307"/>
    <line x1="958.3" y1="313" x2="958.3" y2="307"/>
    <line x1="986.8" y1="313" x2="986.8" y2="307"/>
    <line x1="745" y1="69.3"  x2="751" y2="69.3"/>
    <line x1="745" y1="98.0"  x2="751" y2="98.0"/>
    <line x1="745" y1="126.7" x2="751" y2="126.7"/>
    <line x1="745" y1="155.3" x2="751" y2="155.3"/>
    <line x1="745" y1="184"   x2="751" y2="184"/>
    <line x1="745" y1="212.7" x2="751" y2="212.7"/>
    <line x1="745" y1="241.3" x2="751" y2="241.3"/>
    <line x1="745" y1="270.0" x2="751" y2="270.0"/>
    <line x1="745" y1="298.7" x2="751" y2="298.7"/>
  </g>

  <!-- x tick labels -->
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#000">
    <text x="759.2" y="328">-80</text>
    <text x="787.7" y="328">-60</text>
    <text x="816.1" y="328">-40</text>
    <text x="844.6" y="328">-20</text>
    <text x="873"   y="328">0</text>
    <text x="901.4" y="328">20</text>
    <text x="929.9" y="328">40</text>
    <text x="958.3" y="328">60</text>
    <text x="986.8" y="328">80</text>
  </g>
  <!-- y tick labels -->
  <g font-size="11" font-weight="bold" text-anchor="end" fill="#000">
    <text x="741" y="73.3">80</text>
    <text x="741" y="102.0">60</text>
    <text x="741" y="130.7">40</text>
    <text x="741" y="159.3">20</text>
