    <text x="741" y="302.7">-80</text>
  </g>

  <!-- axis titles -->
  <text x="873" y="353" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">sin<tspan dy="-5" font-size="11">-1</tspan><tspan dy="5" font-size="13">(kx/k0) (deg)</tspan></text>
  <text x="712" y="184" font-size="13" font-weight="bold" text-anchor="middle" fill="#000"
        transform="rotate(-90 712 184)">sin<tspan dy="-5" font-size="11">-1</tspan><tspan dy="5" font-size="13">(ky/k0) (deg)</tspan></text>

  <!-- colour bar -->
  <rect x="1012" y="55" width="20" height="258" fill="url(#cbar_B_p13_F2)" stroke="#000" stroke-width="1.4"/>
  <g font-size="11" font-weight="bold" fill="#000">
    <text x="1036" y="59">0</text>
    <text x="1036" y="84.8">-10</text>
    <text x="1036" y="110.6">-20</text>
    <text x="1036" y="136.4">-30</text>
    <text x="1036" y="162.2">-40</text>
    <text x="1036" y="188.0">-50</text>
