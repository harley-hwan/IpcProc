  <path d="M747.8,184 L873,57.9 L998.2,184 L873,310.1 Z" fill="#d6d6d6" stroke="#5a5a5a" stroke-width="1.2"/>
  <path d="M873,57.9 L873,310.1 M747.8,184 L998.2,184" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="873" cy="184" r="4" fill="#3a3a3a" stroke="none"/>

