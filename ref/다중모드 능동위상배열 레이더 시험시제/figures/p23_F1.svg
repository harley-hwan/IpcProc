<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 574" width="1100" height="574"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>그림 19 ECEF, Vehicle-carried NED, Body 좌표계 간의 비교</title>
  <defs>
    <marker id="arr_B_p23_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrs_B_p23_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1100" height="574" fill="#ffffff"/>

  <g stroke="#000" fill="none" stroke-width="1.6">

    <!-- ================= (a) ECEF / Local NED on the globe ================= -->

    <!-- globe -->
    <circle cx="228" cy="312" r="200"/>
    <!-- equator : far half dashed, near half solid -->
    <path d="M28,312 A200,52 0 0 1 428,312" stroke-dasharray="11,8" stroke-width="1.4"/>
    <path d="M28,312 A200,52 0 0 0 428,312" stroke-width="1.4"/>
    <!-- prime meridian (bulges left) -->
    <path d="M228,112 A62,200 0 0 0 228,512" stroke-width="1.4"/>
    <!-- meridian through On (bulges right) -->
    <path d="M228,112 A114,200 0 0 1 228,512" stroke-width="1.4"/>

    <!-- ECEF axes -->
    <line x1="228" y1="312" x2="228" y2="92"  marker-end="url(#arr_B_p23_F1)"/>
    <line x1="228" y1="312" x2="455" y2="312" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="228" y1="312" x2="172" y2="352" marker-end="url(#arr_B_p23_F1)"/>
    <circle cx="228" cy="312" r="4" fill="#000" stroke="none"/>

    <!-- radius Oe -> On , equatorial projection P' , meridian leg -->
    <line x1="228" y1="312" x2="330" y2="230" stroke-width="1.2"/>
    <line x1="228" y1="312" x2="395" y2="333" stroke-width="1.2"/>
    <path d="M395,333 Q368,290 330,230" stroke-width="1.2"/>

    <!-- latitude angle phi (shaded sector) -->
    <path d="M228,312 L278,319 A50,50 0 0 0 267,281 Z" fill="#e8e8e8" stroke="none"/>
    <path d="M278,319 A50,50 0 0 0 267,281" stroke-width="1.2"/>
    <!-- longitude angle lambda -->
    <path d="M200,332 A34,34 0 0 0 262,316" stroke-width="1.2"/>

    <!-- local tangent plane at On -->
    <path d="M282,196 L362,182 L384,254 L304,268 Z" stroke-width="1.4"/>
    <circle cx="330" cy="230" r="4" fill="#000" stroke="none"/>

    <!-- Local NED axes at On -->
    <line x1="330" y1="230" x2="302" y2="108" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="330" y1="230" x2="444" y2="210" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="330" y1="230" x2="283" y2="268" marker-end="url(#arr_B_p23_F1)"/>

    <!-- call-out wedge to the magnified inset -->
    <line x1="330" y1="230" x2="404" y2="158" stroke-width="1.1"/>
    <line x1="330" y1="230" x2="482" y2="158" stroke-width="1.1"/>

    <!-- magnified inset : altitude h above the ellipsoid -->
    <rect x="352" y="64" width="150" height="94" stroke-width="1.6"/>
    <path d="M356,106 Q428,118 500,130" stroke-width="1.3"/>
    <line x1="420" y1="117" x2="420" y2="79" stroke-width="1.3"/>
    <circle cx="420" cy="76" r="3.5" fill="#000" stroke="none"/>
    <path d="M411,116 L411,107 L420,107" stroke-width="1.1"/>
    <line x1="492" y1="141" x2="425" y2="124" stroke-width="1.2" marker-end="url(#arrs_B_p23_F1)"/>

    <!-- ================= (b) Body / Vehicle-carried NED ================= -->

    <!-- main rotor disc -->
    <ellipse cx="755" cy="125" rx="195" ry="78" fill="#e3e3e3" stroke="none"/>

    <!-- helicopter (simplified silhouette), nose toward lower-left = +Xb -->
    <!-- main rotor blade (behind the airframe) -->
    <polygon points="618,170 986,96 987,104 619,178" fill="#e0e0e0" stroke-width="1.2"/>
    <!-- tail boom -->
    <polygon points="856,220 872,196 946,86 938,78" fill="#c2c2c2" stroke-width="1.4"/>
    <!-- horizontal stabilizer -->
    <polygon points="898,130 930,108 936,116 903,137" fill="#c2c2c2" stroke-width="1.2"/>
    <!-- vertical fin -->
    <polygon points="926,92 942,68 953,73 938,97" fill="#c2c2c2" stroke-width="1.2"/>
    <!-- tail rotor -->
    <circle cx="950" cy="66" r="13" stroke-width="1.1" stroke-dasharray="4,3"/>
    <line x1="940" y1="56" x2="960" y2="76" stroke-width="2.2"/>
    <line x1="960" y1="56" x2="940" y2="76" stroke-width="2.2"/>
    <circle cx="950" cy="66" r="3" fill="#000" stroke="none"/>
    <!-- cabin -->
    <path d="M726,272 C714,256 720,228 744,209 C766,192 800,180 830,182
             C852,184 866,194 872,212 C866,238 838,258 808,270
             C782,281 738,288 726,272 Z" fill="#d6d6d6" stroke-width="1.6"/>
    <!-- windshield -->
    <path d="M732,262 C724,247 730,226 748,212 C760,203 772,198 784,196
             C772,216 754,244 740,262 Z" fill="#f4f4f4" stroke-width="1.2"/>
    <!-- cabin door / side window -->
    <path d="M792,220 C806,214 822,214 832,220 C828,236 814,248 798,252
             C790,242 788,230 792,220 Z" fill="#f4f4f4" stroke-width="1.1"/>
    <!-- engine deck line -->
    <path d="M836,190 C852,194 864,202 870,214" stroke-width="1.1"/>
    <!-- mast + hub -->
    <line x1="796" y1="142" x2="804" y2="192" stroke-width="4"/>
    <circle cx="796" cy="138" r="5.5" fill="#000" stroke="none"/>
    <!-- landing skids -->
    <path d="M750,303 C746,296 751,289 758,290 L866,270" stroke-width="2.2"/>
    <path d="M764,316 C760,309 765,302 772,303 L880,283" stroke-width="2.2"/>
    <line x1="774" y1="278" x2="765" y2="297" stroke-width="1.6"/>
    <line x1="840" y1="263" x2="831" y2="282" stroke-width="1.6"/>
    <line x1="788" y1="291" x2="779" y2="310" stroke-width="1.6"/>
    <line x1="854" y1="276" x2="845" y2="295" stroke-width="1.6"/>

    <!-- Vehicle-carried NED axes at Ob/Onv -->
    <line x1="842" y1="203" x2="910" y2="41"   marker-end="url(#arr_B_p23_F1)"/>
    <line x1="842" y1="203" x2="1040" y2="200" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="842" y1="203" x2="838" y2="378"  marker-end="url(#arr_B_p23_F1)"/>
    <!-- Body axes -->
    <line x1="842" y1="203" x2="588" y2="116" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="842" y1="203" x2="685" y2="338" marker-end="url(#arr_B_p23_F1)"/>
    <circle cx="842" cy="203" r="4" fill="#000" stroke="none"/>
    <line x1="900" y1="220" x2="852" y2="205" stroke-width="1.4" marker-end="url(#arrs_B_p23_F1)"/>

    <!-- body velocities u, v, w -->
    <line x1="742" y1="288" x2="723" y2="304" stroke-width="1.8" marker-end="url(#arrs_B_p23_F1)"/>
    <line x1="704" y1="152" x2="670" y2="140" stroke-width="1.8" marker-end="url(#arrs_B_p23_F1)"/>
    <line x1="824" y1="306" x2="824" y2="334" stroke-width="1.8" marker-end="url(#arrs_B_p23_F1)"/>
    <!-- body rates p, q, r -->
    <path d="M690,314 A11,11 0 1 0 702,326" stroke-width="1.5" marker-end="url(#arrs_B_p23_F1)"/>
    <path d="M624,124 A11,11 0 1 0 636,136" stroke-width="1.5" marker-end="url(#arrs_B_p23_F1)"/>
    <path d="M832,344 A11,11 0 1 0 844,356" stroke-width="1.5" marker-end="url(#arrs_B_p23_F1)"/>

    <!-- Local NED plane -->
    <polygon points="640,406 1064,406 1014,490 590,490" fill="#f2f2f2" stroke-width="1.6"/>
    <line x1="885" y1="452" x2="908" y2="412" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="885" y1="452" x2="996" y2="452" marker-end="url(#arr_B_p23_F1)"/>
    <line x1="885" y1="452" x2="885" y2="498" marker-end="url(#arr_B_p23_F1)"/>
    <circle cx="885" cy="452" r="4" fill="#000" stroke="none"/>
  </g>

  <!-- ================= labels ================= -->
  <g fill="#000">
    <!-- (a) -->
    <text x="222" y="80" text-anchor="end">Z<tspan dy="4" font-size="11">e</tspan></text>
    <text x="248" y="98">X<tspan dy="4" font-size="11">n</tspan></text>
    <text x="268" y="98" font-size="13">(North)</text>
    <text x="450" y="206">Y<tspan dy="4" font-size="11">n</tspan></text>
    <text x="450" y="230" font-size="13">(East)</text>
    <text x="352" y="246">O<tspan dy="4" font-size="11">n</tspan></text>
    <text x="234" y="230" font-size="13">(Down)</text>
    <text x="270" y="254" text-anchor="end">Z<tspan dy="4" font-size="11">n</tspan></text>
    <text x="118" y="230">Prime</text>
    <text x="118" y="250">Meridian</text>
    <text x="214" y="308" text-anchor="end">O<tspan dy="4" font-size="11">e</tspan></text>
    <text x="462" y="318">Y<tspan dy="4" font-size="11">e</tspan></text>
    <text x="146" y="390" text-anchor="middle">X<tspan dy="4" font-size="11">e</tspan></text>
    <text x="240" y="358" font-style="italic" font-size="17">λ</text>
    <text x="292" y="306" font-style="italic" font-size="17">ϕ</text>
    <text x="432" y="98" font-style="italic" font-size="17">h</text>
    <text x="444" y="150" font-style="italic" font-size="17">ϕ</text>
    <text x="395" y="438">e: ECEF</text>
    <text x="395" y="462">n: Local NED</text>
    <text x="252" y="556" font-size="19" text-anchor="middle">(a)</text>

    <!-- (b) -->
    <text x="886" y="42" text-anchor="end">X<tspan dy="4" font-size="11">nv</tspan></text>
    <text x="1046" y="206">Y<tspan dy="4" font-size="11">nv</tspan></text>
    <text x="580" y="120" text-anchor="end">Y<tspan dy="4" font-size="11">b</tspan></text>
    <text x="672" y="358" text-anchor="middle">X<tspan dy="4" font-size="11">b</tspan></text>
    <text x="826" y="390" text-anchor="end">Z<tspan dy="4" font-size="11">nv</tspan><tspan dy="-4">/Z</tspan><tspan dy="4" font-size="11">b</tspan></text>
    <text x="906" y="234">O<tspan dy="4" font-size="11">b</tspan><tspan dy="-4">/O</tspan><tspan dy="4" font-size="11">nv</tspan></text>
    <text x="726" y="286" text-anchor="end" font-style="italic" font-size="17">u</text>
    <text x="708" y="174" font-style="italic" font-size="17">v</text>
    <text x="810" y="322" font-style="italic" font-size="17">w</text>
    <text x="712" y="340" font-style="italic" font-size="17">p</text>
    <text x="624" y="112" font-style="italic" font-size="17">q</text>
    <text x="852" y="356" font-style="italic" font-size="17">r</text>
    <text x="896" y="300" font-size="14">b: Body</text>
    <text x="896" y="322" font-size="14">nv: Vehicle-carried NED</text>
    <text x="896" y="344" font-size="14">n: Local NED</text>
    <text x="908" y="398" text-anchor="middle">X<tspan dy="4" font-size="11">n</tspan></text>
    <text x="1002" y="458">Y<tspan dy="4" font-size="11">n</tspan></text>
    <text x="885" y="518" text-anchor="middle">Z<tspan dy="4" font-size="11">n</tspan></text>
    <text x="874" y="458" text-anchor="end">O<tspan dy="4" font-size="11">n</tspan></text>
    <text x="1050" y="556" font-size="19" text-anchor="middle">(b)</text>
  </g>
</svg>
