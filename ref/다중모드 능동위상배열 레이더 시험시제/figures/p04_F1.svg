<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 947" width="1000" height="947"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>그림 1 ECEF 좌표계와 Local NED 좌표계 정의</title>
  <defs>
    <marker id="arr_B_p04_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrS_B_p04_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1000" height="947" fill="#ffffff"/>

  <!-- ================= Earth sphere ================= -->
  <circle cx="410" cy="565" r="368" fill="#f2f2f2" stroke="#000" stroke-width="2.5"/>

  <!-- equator : back half (dashed) / front half (solid) -->
  <path d="M 42 565 A 368 58 0 0 1 778 565" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="12 9"/>
  <path d="M 42 565 A 368 58 0 0 0 778 565" fill="none" stroke="#000" stroke-width="2"/>

  <!-- prime meridian -->
  <path d="M 410 197 A 45 368 0 0 0 410 933" fill="none" stroke="#000" stroke-width="2"/>

  <!-- meridian through the local NED origin -->
  <path d="M 410 197 C 540 220 610 350 612 612" fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- equatorial projection line (O_e -> foot of the local meridian) -->
  <path d="M 410 565 L 612 612" fill="none" stroke="#000" stroke-width="1.1"/>
  <!-- geocentric radius line O_e -> O_n -->
  <path d="M 410 565 L 589 400" fill="none" stroke="#000" stroke-width="1.1"/>

  <!-- longitude angle lambda (in the equatorial plane) -->
  <path d="M 351 633 Q 435 650 513 587" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="424" y="618" font-size="26">λ</text>

  <!-- latitude angle phi (at Earth centre) -->
  <path d="M 477 579 A 68 68 0 0 0 461 520" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="492" y="548" font-size="26">φ</text>

  <!-- ================= ECEF axes ================= -->
  <line x1="410" y1="565" x2="410" y2="152" stroke="#000" stroke-width="3" marker-end="url(#arr_B_p04_F1)"/>
  <line x1="410" y1="565" x2="855" y2="560" stroke="#000" stroke-width="3" marker-end="url(#arr_B_p04_F1)"/>
  <line x1="410" y1="565" x2="348" y2="636" stroke="#000" stroke-width="3" marker-end="url(#arr_B_p04_F1)"/>

  <text x="362" y="130" font-size="28">Z<tspan dy="7" font-size="18">e</tspan></text>
  <text x="868" y="572" font-size="28">Y<tspan dy="7" font-size="18">e</tspan></text>
  <text x="300" y="676" font-size="28">X<tspan dy="7" font-size="18">e</tspan></text>

  <circle cx="410" cy="565" r="5" fill="#000"/>
  <text x="352" y="558" font-size="28">O<tspan dy="7" font-size="18">e</tspan></text>

  <!-- Prime Meridian caption -->
  <text x="348" y="398" font-size="21" text-anchor="end">Prime</text>
  <text x="348" y="426" font-size="21" text-anchor="end">Meridian</text>

  <!-- ================= local tangent plane + NED frame ================= -->
  <polygon points="521,347 651,336 658,451 528,462" fill="#e8e8e8" stroke="#000" stroke-width="1.6"/>

  <!-- X_n : North -->
  <line x1="589" y1="400" x2="545" y2="192" stroke="#000" stroke-width="3" marker-end="url(#arr_B_p04_F1)"/>
  <text x="462" y="162" font-size="28">X<tspan dy="7" font-size="18">n</tspan><tspan x="499" dy="-7" font-size="18">(North)</tspan></text>

  <!-- Y_n : East -->
  <line x1="589" y1="400" x2="778" y2="374" stroke="#000" stroke-width="3" marker-end="url(#arr_B_p04_F1)"/>
  <text x="792" y="384" font-size="28">Y<tspan dy="7" font-size="18">n</tspan></text>
  <text x="786" y="414" font-size="18">(East)</text>

  <!-- Z_n : Down -->
  <line x1="589" y1="400" x2="505" y2="478" stroke="#000" stroke-width="3" marker-end="url(#arr_B_p04_F1)"/>
  <text x="437" y="441" font-size="18">(Down)</text>
  <text x="437" y="474" font-size="28">Z<tspan dy="7" font-size="18">n</tspan></text>

  <circle cx="589" cy="400" r="5" fill="#000"/>
  <text x="598" y="432" font-size="28">O<tspan dy="7" font-size="18">n</tspan></text>

  <!-- ================= zoom call-out wedge ================= -->
  <polyline points="716,268 630,368 660,270" fill="none" stroke="#000" stroke-width="2"/>

  <!-- ================= inset : geodetic height detail ================= -->
  <rect x="646" y="110" width="282" height="157" fill="#ffffff" stroke="#000" stroke-width="2.5"/>

  <!-- ellipsoid surface curves -->
  <path d="M 648 184 Q 790 203 926 241" fill="none" stroke="#000" stroke-width="1.6"/>
  <path d="M 700 199 Q 820 228 926 265" fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- point above the surface, its normal, h and r -->
  <circle cx="712" cy="131" r="4.5" fill="#000"/>
  <line x1="712" y1="131" x2="737" y2="264" stroke="#000" stroke-width="1.6"/>
  <text x="745" y="172" font-size="24" font-style="italic">h</text>
  <text x="697" y="204" font-size="22" font-style="italic">r</text>

  <!-- local horizontal direction -->
  <line x1="736" y1="243" x2="698" y2="233" stroke="#000" stroke-width="1.4" marker-end="url(#arrS_B_p04_F1)"/>

  <!-- geodetic latitude phi in the inset -->
  <path d="M 716 236 A 40 40 0 0 0 733 251" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="746" y="258" font-size="24">φ</text>

  <!-- ================= legend ================= -->
  <text x="742" y="792" font-size="23">e: ECEF</text>
  <text x="742" y="840" font-size="23">n: Local NED</text>
</svg>
