<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440"
     font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>그림 4. NED 좌표계</title>
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#ffffff"/>

  <text x="330" y="30" text-anchor="middle">Earth True Rotational Axis</text>

  <!-- dome -->
  <path d="M120,320 A210,210 0 0 1 540,320" fill="none" stroke="#000" stroke-width="1.6"/>
  <!-- mean equator -->
  <ellipse cx="330" cy="320" rx="210" ry="58" fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- meridian through the surface point -->
  <path d="M169,357 Q170,200 330,110" fill="none" stroke="#000" stroke-width="1.2"/>
  <!-- latitude circle (near half) -->
  <path d="M210,217 Q331,274 452,214" fill="none" stroke="#000" stroke-width="1.1"/>

  <!-- Z axis -->
  <line x1="330" y1="320" x2="330" y2="72" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar4)"/>
  <text x="342" y="84">Z<tspan dy="5" font-size="11">ECEF</tspan></text>

  <!-- X axis -->
  <line x1="330" y1="320" x2="128" y2="332" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar4)"/>
  <text x="82" y="352">X<tspan dy="5" font-size="11">ECEF</tspan></text>

  <!-- Y axis -->
  <line x1="330" y1="320" x2="396" y2="374" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar4)"/>
  <text x="376" y="398">Y<tspan dy="5" font-size="11">ECEF</tspan></text>

  <!-- radial dashed line to the surface point -->
  <line x1="330" y1="320" x2="210" y2="217" stroke="#000" stroke-width="1.1" stroke-dasharray="5 4"/>
  <!-- meridian foot dashed line -->
  <line x1="330" y1="320" x2="169" y2="357" stroke="#000" stroke-width="1.1" stroke-dasharray="5 4"/>

  <!-- surface point -->
  <circle cx="210" cy="217" r="4.5" fill="#000"/>

  <!-- N -->
  <line x1="210" y1="217" x2="177" y2="165" stroke="#000" stroke-width="1.4" marker-end="url(#ar4)"/>
  <text x="145" y="154">N<tspan dy="5" font-size="11">{LI}</tspan></text>
  <!-- E -->
  <line x1="210" y1="217" x2="293" y2="211" stroke="#000" stroke-width="1.4" marker-end="url(#ar4)"/>
  <text x="245" y="194">E<tspan dy="5" font-size="11">{LI}</tspan></text>
  <!-- D -->
  <line x1="210" y1="217" x2="297" y2="290" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar4)"/>
  <text x="200" y="270">D<tspan dy="5" font-size="11">{LI}</tspan></text>

  <!-- latitude angle -->
  <path d="M273,271 A75,75 0 0 0 257,337" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="282" y="312" font-style="italic">φ<tspan dy="5" font-size="11">0</tspan></text>

  <!-- longitude angle -->
  <path d="M190,328 A140,140 0 0 0 194,351" fill="none" stroke="#000" stroke-width="1.3"/>
  <path d="M176,327 A155,155 0 0 0 180,353" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="176" y="376" font-style="italic">λ<tspan dy="5" font-size="11">0</tspan></text>

  <text x="500" y="348">Mean Equator</text>
</svg>
