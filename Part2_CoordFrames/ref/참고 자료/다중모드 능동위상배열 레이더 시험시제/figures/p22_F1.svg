    <path d="M99,332 C50,368 54,430 180,448"/>
    <path d="M776,80 C802,60 832,72 845,108" marker-end="url(#arrS_B_p22_F1)"/>
    <path d="M849,113 C880,122 894,140 891,164" marker-end="url(#arrS_B_p22_F1)"/>
  </g>

  <!-- 라벨 -->
  <g fill="#000">
    <text x="80" y="222" font-size="30">X<tspan dy="7" font-size="20">W</tspan></text>
    <text x="20" y="358" font-size="30">X<tspan dy="7" font-size="20">s</tspan></text>
    <text x="118" y="502" font-size="30">X<tspan dy="7" font-size="20">Ins</tspan></text>
    <text x="48" y="294" font-size="28">&#946;</text>
    <text x="96" y="408" font-size="27">Yaw(&#968;)</text>

    <text x="714" y="42" font-size="30">Y<tspan dy="7" font-size="20">Ins</tspan></text>
    <text x="798" y="42" font-size="27">Yaw(&#936;)</text>
    <text x="872" y="98" font-size="30">Y<tspan dy="7" font-size="20">s</tspan></text>
    <text x="902" y="146" font-size="28">&#946;</text>
    <text x="906" y="212" font-size="30">Y<tspan dy="7" font-size="20">W</tspan></text>

    <text x="604" y="768" font-size="30">Z<tspan dy="7" font-size="20">W</tspan><tspan dy="-7" font-size="30">, Z</tspan><tspan dy="7" font-size="20">S</tspan><tspan dy="-7" font-size="30">, Z</tspan><tspan dy="7" font-size="20">Ins</tspan></text>
