  <!-- 좌표축 -->
  <g stroke="#000" fill="none" stroke-linecap="round">
    <!-- X_w : 기체 전방 (실선) -->
    <line x1="642" y1="326" x2="113" y2="248" stroke-width="2.4" marker-end="url(#arr_B_p22_F1)"/>
    <!-- X_s (점선) -->
    <line x1="642" y1="326" x2="96" y2="326" stroke-width="2" stroke-dasharray="3 7" marker-end="url(#arr_B_p22_F1)"/>
    <!-- X_ins (점선) -->
    <line x1="642" y1="326" x2="186" y2="446" stroke-width="2" stroke-dasharray="3 7" marker-end="url(#arr_B_p22_F1)"/>
    <!-- Y_w (실선) -->
    <line x1="642" y1="326" x2="858" y2="187" stroke-width="2.4" marker-end="url(#arr_B_p22_F1)"/>
    <!-- Y_s (점선) -->
    <line x1="642" y1="326" x2="843" y2="119" stroke-width="2" stroke-dasharray="3 7" marker-end="url(#arr_B_p22_F1)"/>
