<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" width="1000" height="704"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>그림 16 INU 좌표계와 Space Stable 좌표계 그리고 Body 좌표계간 관계</title>
  <defs>
    <marker id="arr_B_p20_F1" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrs_B_p20_F1" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1000" height="704" fill="#ffffff"/>

  <!-- ================= 항공기 (상면 실루엣, 기수 좌측) ================= -->
  <g transform="matrix(0.826 0.188 -0.626 0.435 657 284)"
     stroke="#000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 동체 + 주익 + 수평미익 -->
    <path fill="#d6d6d6" d="M -400 0
      L -366 -17 L -278 -28 L -168 -36 L -78 -42 L -44 -48 L -18 -58
      L 44 -206 L 80 -220 L 104 -72
      L 134 -64 L 156 -60
      L 208 -138 L 244 -142 L 250 -72
      L 258 -52 L 263 -28 L 265 0
      L 263 28 L 258 52 L 250 72
      L 244 142 L 208 138 L 156 60
      L 134 64 L 104 72
      L 80 220 L 44 206 L -18 58
      L -44 48 L -78 42 L -168 36 L -278 28 L -366 17 Z"/>
    <!-- 주익 뿌리 분할선 -->
    <path d="M -18 -58 L 104 -72" fill="none" stroke-width="1.6"/>
    <path d="M -18  58 L 104  72" fill="none" stroke-width="1.6"/>
    <!-- 수직 미익 (좌/우) -->
    <path d="M 130 -66 L 198 -108 L 228 -100 L 170 -60 Z" fill="#f2f2f2"/>
    <path d="M 130  66 L 198  108 L 228  100 L 170  60 Z" fill="#f2f2f2"/>
    <!-- 캐노피 -->
    <ellipse cx="-238" cy="0" rx="98" ry="26" fill="#f2f2f2"/>
    <!-- 엔진 노즐 -->
    <ellipse cx="259" cy="-21" rx="9" ry="14" fill="#e8e8e8" stroke-width="1.6"/>
    <ellipse cx="259" cy="21"  rx="9" ry="14" fill="#e8e8e8" stroke-width="1.6"/>
  </g>

  <!-- ================= 좌표축 ================= -->
  <g fill="none" stroke="#000" stroke-linecap="round">

    <!-- X axis group : forward -->
    <!-- X_S : Space Stable, 실선 -->
    <line x1="657" y1="284" x2="185" y2="258" stroke-width="2.4" marker-end="url(#arr_B_p20_F1)"/>
    <!-- X_B : Body, 점선 -->
    <line x1="657" y1="284" x2="203" y2="191" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr_B_p20_F1)"/>
    <!-- X_Ins : INU, 가는 점선 -->
    <line x1="657" y1="284" x2="252" y2="307" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrs_B_p20_F1)"/>
    <!-- Pitch(θ) : X_S → X_B -->
    <path d="M 170 254 Q 148 224 165 199" stroke-width="1.8" marker-end="url(#arrs_B_p20_F1)"/>
    <!-- Yaw(Ψ) : X_Ins → X_S -->
    <path d="M 238 305 Q 192 302 172 274" stroke-width="1.8" marker-end="url(#arrs_B_p20_F1)"/>

    <!-- Y axis group : right wing -->
    <!-- Y_Ins : 가는 실선 -->
    <line x1="657" y1="284" x2="781" y2="68" stroke-width="1.4" marker-end="url(#arrs_B_p20_F1)"/>
    <!-- Y_S : 실선 -->
    <line x1="657" y1="284" x2="843" y2="96" stroke-width="2.4" marker-end="url(#arr_B_p20_F1)"/>
    <!-- Y_B : 점선 -->
    <line x1="657" y1="284" x2="828" y2="165" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr_B_p20_F1)"/>
    <!-- Yaw(Ψ) : Y_Ins → Y_S -->
    <path d="M 788 52 Q 830 48 845 79" stroke-width="1.8" marker-end="url(#arrs_B_p20_F1)"/>
    <!-- Roll(Φ) : Y_S → Y_B -->
    <path d="M 852 100 Q 852 126 840 148" stroke-width="1.8" marker-end="url(#arrs_B_p20_F1)"/>

    <!-- Z axis group : down -->
    <!-- Z_S = Z_Ins : 실선 수직 -->
    <line x1="657" y1="284" x2="657" y2="632" stroke-width="2.4" marker-end="url(#arr_B_p20_F1)"/>
    <!-- Pitch 후 중간축 : 점선 -->
    <line x1="657" y1="284" x2="588" y2="596" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr_B_p20_F1)"/>
    <!-- Z_B : 점선 -->
    <line x1="657" y1="284" x2="546" y2="647" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arr_B_p20_F1)"/>
    <!-- Pitch(θ) : Z_S → 중간축 -->
    <path d="M 653 632 Q 622 630 607 615" stroke-width="1.8" marker-end="url(#arrs_B_p20_F1)"/>
    <!-- Roll(Φ) : 중간축 → Z_B -->
    <path d="M 588 606 Q 570 626 555 640" stroke-width="1.8" marker-end="url(#arrs_B_p20_F1)"/>
  </g>

  <!-- ================= 라벨 ================= -->
  <g fill="#000">
    <!-- 좌측 (X 축) -->
    <text x="150" y="267" text-anchor="end" font-size="24" font-weight="bold">X<tspan dy="6" font-size="15">S</tspan></text>
    <text x="193" y="170" text-anchor="middle" font-size="19">X<tspan dy="5" font-size="13">B</tspan></text>
    <text x="142" y="222" text-anchor="end" font-size="18">Pitch(θ)</text>
    <text x="158" y="320" text-anchor="end" font-size="18">Yaw(Ψ)</text>
    <text x="292" y="350" text-anchor="middle" font-size="19">X<tspan dy="5" font-size="13">Ins</tspan></text>

    <!-- 우측 상단 (Y 축) -->
    <text x="737" y="45" text-anchor="middle" font-size="19">Y<tspan dy="5" font-size="13">Ins</tspan></text>
    <text x="832" y="45" text-anchor="middle" font-size="18">Yaw(Ψ)</text>
    <text x="864" y="107" text-anchor="start" font-size="24" font-weight="bold">Y<tspan dy="6" font-size="15">S</tspan></text>
    <text x="860" y="148" text-anchor="start" font-size="18">Roll(Φ)</text>
    <text x="848" y="192" text-anchor="start" font-size="19">Y<tspan dy="5" font-size="13">B</tspan></text>

    <!-- 하단 (Z 축) -->
    <text x="672" y="598" text-anchor="start" font-size="18">Pitch(θ)</text>
    <text x="518" y="596" text-anchor="end" font-size="18">Roll(Φ)</text>
    <text x="626" y="674" text-anchor="start" font-size="24" font-weight="bold">Z<tspan dy="6" font-size="15">S</tspan><tspan dy="-6" font-size="24"> , Z</tspan><tspan dy="6" font-size="15">Ins</tspan></text>
    <text x="528" y="691" text-anchor="middle" font-size="19">Z<tspan dy="5" font-size="13">B</tspan></text>
  </g>
</svg>
