<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 534" width="1100" height="534"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>그림 3 North-East-Down과 East-North-Up의 LSR 좌표계 정의</title>
  <defs>
    <marker id="arr_B_p05_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arr_B_p05_F1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1100" height="534" fill="#ffffff"/>

  <!-- ============================ LEFT PANEL : ECEF + Local NED ============================ -->
  <g stroke="#000" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">

    <!-- globe -->
    <circle cx="250" cy="300" r="200" fill="#f2f2f2" stroke="#000" stroke-width="1.8"/>

    <!-- equator : back half dashed, front half solid -->
    <path d="M 50,300 A 200,33 0 0 1 450,300" stroke-dasharray="12 8" stroke-width="1.5"/>
    <path d="M 50,300 A 200,33 0 0 0 450,300" stroke-width="1.5"/>

    <!-- prime meridian -->
    <path stroke-width="1.4" d="M 250,102.8 L 237.0,117.8 L 225.0,145.2 L 214.6,183.2 L 206.6,229.1 L 201.6,279.8
             L 200.0,332.0 L 201.6,381.9 L 206.6,426.3 L 214.6,462.0 L 225.0,486.8 L 237.0,498.8 L 250,497.2"/>

    <!-- meridian through the local (NED) origin -->
    <path stroke-width="1.4" d="M 250,102.8 L 268.4,110.7 L 286.2,124.3 L 303.0,143.2 L 318.1,166.9 L 331.2,194.7
             L 341.8,225.6 L 349.6,258.9 L 354.4,293.3 L 356.0,328.0 L 354.4,361.8 L 349.6,393.7
             L 341.8,422.8 L 331.2,448.2 L 318.1,469.1 L 303.0,484.8 L 286.2,494.9 L 268.4,499.1 L 250,497.2"/>

    <!-- ECEF axes -->
    <line x1="250" y1="300" x2="250" y2="78" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="250" y1="300" x2="495" y2="300" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="250" y1="300" x2="203" y2="341" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>

    <!-- equatorial projection of the local origin (longitude line) -->
    <line x1="250" y1="300" x2="356" y2="328" stroke-width="1.1"/>
    <!-- lambda arc between X_e and the projection line -->
    <path d="M 206,342 Q 276,354 352,328" stroke-width="1.1"/>
    <!-- phi arc between the equatorial plane and the radial line to the local origin -->
    <path d="M 279,262 A 48,48 0 0 1 296,312" stroke-width="1.1"/>

    <!-- radial line O_e -> O_n , with the Z_n (Down) arrow on it -->
    <line x1="279" y1="262" x2="250" y2="300" stroke-width="1.4"/>
    <line x1="310" y1="222" x2="281" y2="260" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="331" y1="195" x2="311" y2="221" stroke-width="1.6" stroke-dasharray="5 4"/>

    <!-- local tangent plane at O_n -->
    <path d="M 305,170 L 369,165 L 383,226 L 320,230 Z" fill="none" stroke-width="1.6"/>

    <!-- local NED axes -->
    <line x1="331" y1="195" x2="308" y2="65" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="331" y1="195" x2="457" y2="178" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>

    <!-- origin dots -->
    <circle cx="250" cy="300" r="3.2" fill="#000" stroke="none"/>
    <circle cx="331" cy="195" r="3.2" fill="#000" stroke="none"/>

    <!-- magnifier callout wedge : inset box  ->  O_n -->
    <line x1="361" y1="128" x2="334" y2="199" stroke-width="1.4"/>
    <line x1="398" y1="128" x2="337" y2="194" stroke-width="1.4"/>

    <!-- inset : definition of h and phi on the ellipsoid -->
    <rect x="356" y="31" width="161" height="96" fill="#ffffff" stroke="#000" stroke-width="1.8"/>
    <path d="M 360,80 Q 437,94 515,115" stroke-width="1.5"/>
    <line x1="401" y1="45" x2="388" y2="133" stroke-width="1.5"/>
    <path d="M 389,86 L 396,87 L 395,94" stroke-width="1.1"/>
    <line x1="411" y1="66" x2="399" y2="69" stroke-width="1.1" marker-end="url(#arr_B_p05_F1s)"/>
    <line x1="500" y1="127" x2="393" y2="106" stroke-width="1.3" marker-end="url(#arr_B_p05_F1)"/>
    <circle cx="401" cy="43" r="3.4" fill="#000" stroke="none"/>
  </g>

  <g fill="#000" stroke="none">
    <text x="250" y="62" text-anchor="middle">Z<tspan dy="4" font-size="11">e</tspan></text>
    <text x="503" y="306">Y<tspan dy="4" font-size="11">e</tspan></text>
    <text x="196" y="364" text-anchor="middle">X<tspan dy="4" font-size="11">e</tspan></text>
    <text x="268" y="54">X<tspan dy="4" font-size="11">n</tspan><tspan dy="-4" font-size="12"> (North)</tspan></text>
    <text x="466" y="190">Y<tspan dy="4" font-size="11">n</tspan></text>
    <text x="466" y="212" font-size="12">(East)</text>
    <text x="299" y="230" text-anchor="end" font-size="13">(Down)</text>
    <text x="281" y="248" text-anchor="end">Z<tspan dy="4" font-size="11">n</tspan></text>
    <text x="360" y="216">O<tspan dy="4" font-size="11">n</tspan></text>
    <text x="232" y="290" text-anchor="end">O<tspan dy="4" font-size="11">e</tspan></text>
    <text x="203" y="203" text-anchor="end">Prime</text>
    <text x="203" y="223" text-anchor="end">Meridian</text>
    <text x="303" y="282">φ</text>
    <text x="266" y="327">λ</text>
    <text x="419" y="66" font-style="italic">h</text>
    <text x="420" y="121">φ</text>
    <text x="424" y="436" font-size="14">e: ECEF</text>
    <text x="424" y="460" font-size="14">n: Local NED</text>
  </g>

  <!-- ============================ RIGHT PANEL : ECEF + Local ENU ============================ -->
  <g stroke="#000" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">

    <circle cx="790" cy="300" r="200" fill="#f2f2f2" stroke="#000" stroke-width="1.8"/>

    <path d="M 590,300 A 200,33 0 0 1 990,300" stroke-dasharray="12 8" stroke-width="1.5"/>
    <path d="M 590,300 A 200,33 0 0 0 990,300" stroke-width="1.5"/>

    <!-- prime meridian -->
    <path stroke-width="1.4" d="M 790,102.8 L 777.0,117.8 L 765.0,145.2 L 754.6,183.2 L 746.6,229.1 L 741.6,279.8
             L 740.0,332.0 L 741.6,381.9 L 746.6,426.3 L 754.6,462.0 L 765.0,486.8 L 777.0,498.8 L 790,497.2"/>

    <!-- meridian through the local (ENU) origin -->
    <path stroke-width="1.4" d="M 790,102.8 L 810.4,110.4 L 830.2,123.8 L 848.8,142.6 L 865.6,166.1 L 880.1,193.7
             L 891.8,224.5 L 900.5,257.7 L 905.8,292.1 L 907.6,326.7 L 905.8,360.5 L 900.5,392.5
             L 891.8,421.7 L 880.1,447.3 L 865.6,468.3 L 848.8,484.2 L 830.2,494.4 L 810.4,498.8 L 790,497.2"/>

    <!-- radial line to the local origin -->
    <line x1="790" y1="300" x2="880" y2="194" stroke-width="1.4"/>

    <!-- ECEF axes -->
    <line x1="790" y1="300" x2="790" y2="78" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="790" y1="300" x2="1020" y2="300" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="790" y1="300" x2="743" y2="341" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>

    <line x1="790" y1="300" x2="908" y2="327" stroke-width="1.1"/>
    <path d="M 746,342 Q 822,356 904,327" stroke-width="1.1"/>
    <path d="M 825,259 A 54,54 0 0 1 843,312" stroke-width="1.1"/>

    <!-- local tangent plane -->
    <path d="M 854,169 L 918,164 L 932,225 L 869,229 Z" fill="#d6d6d6" stroke="#000" stroke-width="1.6"/>

    <!-- local ENU axes -->
    <line x1="880" y1="194" x2="850" y2="66" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="880" y1="194" x2="950" y2="127" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>
    <line x1="880" y1="194" x2="1013" y2="194" stroke-width="1.8" marker-end="url(#arr_B_p05_F1)"/>

    <circle cx="790" cy="300" r="3.2" fill="#000" stroke="none"/>
  </g>

  <g fill="#000" stroke="none">
    <text x="790" y="62" text-anchor="middle">Z<tspan dy="4" font-size="11">ecef</tspan></text>
    <text x="1028" y="306">Y<tspan dy="4" font-size="11">ecef</tspan></text>
    <text x="742" y="366" text-anchor="middle">X<tspan dy="4" font-size="11">ecef</tspan></text>
    <text x="862" y="78">North</text>
    <text x="957" y="142">Up</text>
    <text x="988" y="180" text-anchor="middle">East</text>
    <text x="738" y="256" text-anchor="middle" transform="rotate(-90 738 256)">Prime Meridian</text>
    <text x="849" y="284">φ</text>
    <text x="806" y="327">λ</text>
  </g>
</svg>
