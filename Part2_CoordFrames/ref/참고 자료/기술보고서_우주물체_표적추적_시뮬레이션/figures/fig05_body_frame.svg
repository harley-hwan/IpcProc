<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520"
     font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>그림 5. Body 좌표계</title>
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="700" height="520" fill="#ffffff"/>

  <!-- earth surface -->
  <path d="M50,360 A700,700 0 0 1 650,360 L650,470 L50,470 Z" fill="#f0f0f0" stroke="none"/>
  <path d="M50,360 A700,700 0 0 1 650,360" fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- antenna face -->
  <polygon points="250,335 430,335 490,285 310,285" fill="#d5d5d5" stroke="#000" stroke-width="1.3"/>
  <text x="430" y="352">Antenna</text>

  <!-- origin -->
  <circle cx="360" cy="310" r="3.5" fill="#000"/>
  <text x="300" y="306">O<tspan dy="5" font-size="11">Body</tspan></text>

  <!-- Z_Ant (up, dashed) -->
  <line x1="360" y1="310" x2="360" y2="90" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar5)"/>
  <text x="336" y="80">Z<tspan dy="5" font-size="11">Ant</tspan></text>

  <!-- Y_Ant (dashed) / X_Body (solid) -->
  <line x1="360" y1="310" x2="452" y2="182" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar5)"/>
  <text x="456" y="176">Y<tspan dy="5" font-size="11">Ant</tspan></text>
  <line x1="360" y1="310" x2="466" y2="212" stroke="#000" stroke-width="1.6" marker-end="url(#ar5)"/>
  <text x="470" y="216">X<tspan dy="5" font-size="11">Body</tspan></text>

  <!-- X_Ant (dashed) / Y_Body (solid) -->
  <line x1="360" y1="310" x2="596" y2="304" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar5)"/>
  <text x="602" y="302">X<tspan dy="5" font-size="11">Ant</tspan></text>
  <line x1="360" y1="310" x2="540" y2="322" stroke="#000" stroke-width="1.6" marker-end="url(#ar5)"/>
  <text x="500" y="344">Y<tspan dy="5" font-size="11">Body</tspan></text>

  <!-- Z_Body (down) -->
  <line x1="360" y1="310" x2="360" y2="448" stroke="#000" stroke-width="1.6" marker-end="url(#ar5)"/>
  <text x="336" y="474">Z<tspan dy="5" font-size="11">Body</tspan></text>
</svg>
