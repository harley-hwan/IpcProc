<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400"
     font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>그림 2. ECI 좌표계</title>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#ffffff"/>

  <text x="310" y="34" text-anchor="middle">Earth True Rotational Axis</text>

  <!-- dome -->
  <path d="M110,300 A200,200 0 0 1 510,300" fill="none" stroke="#000" stroke-width="1.6"/>
  <!-- mean equator -->
  <ellipse cx="310" cy="300" rx="200" ry="58" fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- Z axis -->
  <line x1="310" y1="300" x2="310" y2="52" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="322" y="62">Z<tspan dy="5" font-size="11">ECI</tspan></text>

  <!-- X axis -->
  <line x1="310" y1="300" x2="112" y2="305" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="66" y="322">X<tspan dy="5" font-size="11">ECI</tspan></text>

  <!-- Y axis -->
  <line x1="310" y1="300" x2="400" y2="350" stroke="#000" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="396" y="374">Y<tspan dy="5" font-size="11">ECI</tspan></text>

  <text x="470" y="326">Mean Equator</text>
</svg>
