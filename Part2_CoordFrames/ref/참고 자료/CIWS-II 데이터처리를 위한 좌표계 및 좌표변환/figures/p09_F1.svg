<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 336" width="1050" height="336"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>2.2.7. Platform Body to GunBody 좌표계 변환 - 함선 Body 좌표계와 GunBody 좌표계의 장착 Offset</title>
  <defs>
    <marker id="arr_A_p09_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1050" height="336" fill="#ffffff"/>

  <!-- ================= 함선 선체 (평면도, 함수 = 오른쪽) ================= -->
  <g>
    <path d="M51,58 L88,58 L122,52 L650,52 L750,60 L845,76 L940,98
             Q975,102 988,107 Q975,112 940,117
             L845,142 L750,157 L650,162 L183,159 L122,159 L88,151 L51,150 Z"
          fill="#d6d6d6" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M57,63 L90,63 L124,57 L648,57 L747,65 L841,81 L933,101 L977,107
             L933,113 L841,137 L747,152 L648,157 L185,154 L124,154 L90,146 L57,145 Z"
          fill="none" stroke="#000000" stroke-width="0.7" opacity="0.45"/>
  </g>

  <!-- ================= 함미 헬기 착함 갑판 표시 ================= -->
  <g stroke="#000000" fill="none">
    <rect x="70" y="68" width="132" height="75" rx="10" fill="#f2f2f2" stroke-width="1"/>
    <line x1="143" y1="69" x2="143" y2="142" stroke-width="1"/>
    <rect x="80" y="96" width="54" height="18" stroke-width="0.9" fill="#e8e8e8"/>
    <line x1="149" y1="74" x2="196" y2="137" stroke-width="1"/>
    <line x1="196" y1="74" x2="149" y2="137" stroke-width="1"/>
  </g>

  <!-- ================= 갑판 구조물 (단순화) ================= -->
  <g stroke="#000000" stroke-width="0.7" fill="#f2f2f2">
    <circle cx="371" cy="79" r="7"/>
    <circle cx="387" cy="79" r="7"/>
    <circle cx="379" cy="93" r="7"/>
    <rect x="420" y="64" width="24" height="76" rx="3"/>
    <rect x="452" y="64" width="24" height="76" rx="3"/>
    <circle cx="524" cy="86" r="6.5"/>
    <circle cx="539" cy="86" r="6.5"/>
    <circle cx="524" cy="110" r="6.5"/>
    <circle cx="539" cy="110" r="6.5"/>
    <rect x="582" y="72" width="94" height="72" rx="6"/>
    <rect x="700" y="84" width="90" height="50" rx="5"/>
    <rect x="818" y="94" width="50" height="32" rx="4"/>
  </g>

  <!-- ================= CIWS-II 함포 (GunBody) ================= -->
  <g>
    <rect x="320" y="103" width="34" height="9" fill="#d6d6d6" stroke="#000000" stroke-width="1"/>
    <rect x="352" y="100" width="8" height="14" fill="#d6d6d6" stroke="#000000" stroke-width="1"/>
    <path d="M234,55 L311,55 L324,68 L324,135 L311,148 L234,148 L221,135 L221,68 Z"
          fill="#d6d6d6" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="236" y="66" width="70" height="71" rx="5" fill="#e8e8e8" stroke="#000000" stroke-width="0.9"/>
    <circle cx="266" cy="107" r="13" fill="none" stroke="#000000" stroke-width="0.9"/>
  </g>

  <!-- ================= 장착 Offset 연결선 (GunBody 원점 → Body 원점) ================= -->
  <polyline points="266,107 327,32 448,32 501,107"
            fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- ================= GunBody 좌표축 ================= -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <line x1="266" y1="107" x2="408" y2="107" marker-end="url(#arr_A_p09_F1)"/>
    <line x1="266" y1="107" x2="266" y2="232" marker-end="url(#arr_A_p09_F1)"/>
  </g>

  <!-- ================= Platform Body 좌표축 ================= -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <line x1="501" y1="107" x2="1003" y2="107" marker-end="url(#arr_A_p09_F1)"/>
    <line x1="501" y1="107" x2="501" y2="326" marker-end="url(#arr_A_p09_F1)"/>
  </g>

  <!-- ================= 원점 표시 ================= -->
  <circle cx="501" cy="107" r="5" fill="#000000"/>
  <circle cx="266" cy="107" r="4" fill="#000000"/>

  <!-- ================= 라벨 ================= -->
  <g fill="#000000" font-style="italic">
    <text x="378" y="126" font-size="17">x<tspan dy="-6" font-size="12">G.B.</tspan></text>
    <text x="276" y="224" font-size="17">y<tspan dy="-6" font-size="12">G.B.</tspan></text>
    <text x="982" y="128" font-size="17">x<tspan dy="-6" font-size="12">B</tspan></text>
    <text x="510" y="312" font-size="17">y<tspan dy="-6" font-size="12">B</tspan></text>
  </g>

  <!-- 장착 Offset 벡터 (함선 Body 좌표계 기준) -->
  <text xml:space="preserve" x="464" y="24" font-size="15" font-style="italic" fill="#000000">P<tspan dy="4" font-size="11">Off</tspan><tspan dy="-9" font-size="11">B</tspan><tspan dy="5" font-size="15"> = [ x</tspan><tspan dy="4" font-size="11">Off</tspan><tspan dy="-9" font-size="11">B</tspan><tspan dy="5" font-size="15"> y</tspan><tspan dy="4" font-size="11">Off</tspan><tspan dy="-9" font-size="11">B</tspan><tspan dy="5" font-size="15"> z</tspan><tspan dy="4" font-size="11">Off</tspan><tspan dy="-9" font-size="11">B</tspan><tspan dy="5" font-size="15"> ]</tspan><tspan dy="-5" font-size="11">T</tspan></text>
</svg>
