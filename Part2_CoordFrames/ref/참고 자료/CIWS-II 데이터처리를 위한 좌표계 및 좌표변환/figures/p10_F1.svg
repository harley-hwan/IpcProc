<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 968" width="924" height="968"
     font-family="Helvetica, Arial, 'Malgun Gothic', sans-serif" font-size="15">
  <title>2.2.9. GunBody to Antenna XYZ 좌표계 변환 - GunBody 좌표계와 안테나 XYZ 좌표계의 Offset 관계</title>
  <defs>
    <marker id="arr_A_p10_F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="924" height="968" fill="#ffffff"/>

  <!-- ================= 함정 상부구조 평면도 (단순 벡터 실루엣) ================= -->
  <g stroke="#000" stroke-linejoin="round">
    <!-- 외곽 (팔각형 형태의 상부 갑판실) -->
    <polygon points="85,285 575,285 640,350 640,870 575,935 85,935 20,870 20,350"
             fill="#f2f2f2" stroke-width="2"/>

    <!-- 중앙 상부구조 -->
    <rect x="235" y="290" width="157" height="610" fill="#e8e8e8" stroke-width="1.5"/>
    <!-- 마스트 -->
    <rect x="302" y="88" width="50" height="202" fill="#d6d6d6" stroke-width="1.5"/>

    <!-- 네 모서리 안테나 설치 위치 블록 -->
    <rect x="55"  y="330" width="173" height="215" fill="#d6d6d6" stroke-width="1.5"/>
    <rect x="400" y="330" width="205" height="215" fill="#d6d6d6" stroke-width="1.5"/>
    <rect x="400" y="700" width="205" height="215" fill="#d6d6d6" stroke-width="1.5"/>
    <rect x="55"  y="700" width="173" height="215" fill="#d6d6d6" stroke-width="1.5"/>
  </g>
  <!-- 중앙 구조물 내부 디테일 -->
  <g stroke="#8a8a8a" stroke-width="1" fill="none">
    <line x1="255" y1="330" x2="372" y2="330"/>
    <line x1="255" y1="380" x2="372" y2="380"/>
    <line x1="255" y1="700" x2="372" y2="700"/>
    <line x1="255" y1="800" x2="372" y2="800"/>
    <line x1="313" y1="300" x2="313" y2="890"/>
  </g>

  <!-- 모서리 위치 번호 -->
  <g font-size="30" font-weight="bold" fill="#3a3a3a">
    <text x="70" y="522">#1</text>
    <text x="510" y="503">#2</text>
    <text x="500" y="806">#3</text>
    <text x="70" y="806">#4</text>
  </g>

  <!-- ================= GunBody 좌표계 ================= -->
  <g stroke="#000" stroke-width="2.4" fill="none">
    <!-- x^G.B : 함수(뱃머리) 방향, 위쪽 -->
    <line x1="334" y1="631" x2="334" y2="28" marker-end="url(#arr_A_p10_F1)"/>
    <!-- y^G.B : 우현 방향, 오른쪽 -->
    <line x1="334" y1="631" x2="702" y2="631" marker-end="url(#arr_A_p10_F1)"/>
  </g>
  <!-- GunBody 원점 -->
  <circle cx="334" cy="631" r="11" fill="#000"/>

  <text x="352" y="56" font-style="italic" font-size="22">x<tspan dy="-9" font-size="14">G.B</tspan></text>
  <text x="634" y="676" font-style="italic" font-size="22">y<tspan dy="-9" font-size="14">G.B</tspan></text>

  <!-- ================= Antenna XYZ 좌표계 (#2 안테나) ================= -->
  <g stroke="#000" stroke-width="2.4" fill="none">
    <line x1="525" y1="528" x2="424" y2="372" marker-end="url(#arr_A_p10_F1)"/>
    <line x1="525" y1="528" x2="676" y2="392" marker-end="url(#arr_A_p10_F1)"/>
    <line x1="525" y1="528" x2="493" y2="563" marker-end="url(#arr_A_p10_F1)"/>
  </g>
  <!-- 안테나 원점 -->
  <circle cx="525" cy="528" r="11" fill="#000"/>

  <text x="436" y="366" font-style="italic" font-size="20">x<tspan dy="-8" font-size="13">Ant</tspan></text>
  <text x="676" y="436" font-style="italic" font-size="20">z<tspan dy="-8" font-size="13">Ant</tspan></text>
  <text x="478" y="592" font-style="italic" font-size="20">y<tspan dy="-8" font-size="13">Ant</tspan></text>

  <!-- ================= Offset 벡터 (GunBody 원점 <-> 안테나 원점) ================= -->
  <g stroke="#000" stroke-width="2.4" fill="none">
    <path d="M 511,524 L 450,510 L 360,558 L 341,620" marker-end="url(#arr_A_p10_F1)"/>
    <path d="M 341,620 L 360,558 L 450,510 L 513,526" marker-end="url(#arr_A_p10_F1)"/>
  </g>

  <!-- Offset 벡터 -> 수식 지시선 -->
  <polyline points="404,534 404,775 618,775" fill="none" stroke="#000" stroke-width="2.4"
            marker-end="url(#arr_A_p10_F1)"/>

  <!-- ================= 수식 : P^G.B_Off = [x^G.B_Off, y^G.B_Off, z^G.B_Off]^T ================= -->
  <g font-style="italic">
    <text x="648" y="778" font-size="28">P</text>
    <text x="672" y="762" font-size="14">G.B</text>
    <text x="672" y="792" font-size="14">Off</text>

    <text x="726" y="778" font-size="26" font-style="normal">=</text>

    <!-- 대괄호 -->
    <g stroke="#000" stroke-width="2.4" fill="none">
      <path d="M 782,690 L 770,690 L 770,872 L 782,872"/>
      <path d="M 862,690 L 874,690 L 874,872 L 862,872"/>
    </g>

    <text x="796" y="738" font-size="26">x</text>
    <text x="812" y="722" font-size="14">G.B</text>
    <text x="812" y="752" font-size="14">Off</text>

    <text x="796" y="798" font-size="26">y</text>
    <text x="812" y="782" font-size="14">G.B</text>
    <text x="812" y="812" font-size="14">Off</text>

    <text x="796" y="852" font-size="26">z</text>
    <text x="812" y="836" font-size="14">G.B</text>
    <text x="812" y="866" font-size="14">Off</text>
  </g>
</svg>
